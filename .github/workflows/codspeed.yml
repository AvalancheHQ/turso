name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  codspeed:
    name: Run benchmarks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Setup mold linker
      uses: rui314/setup-mold@v1
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        cache-target: release
    - name: Install cargo-codspeed
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-codspeed@4.2.0
    - name: Build benchmarks
      run: cargo codspeed build --package turso_core
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: cargo codspeed run --package turso_core
